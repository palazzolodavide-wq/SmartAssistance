services:

  postgres:
    image: postgres:16
    container_name: sa-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: smartassistance
      POSTGRES_USER: sauser
      POSTGRES_PASSWORD: change_me

    ports:
      - "5433:5432"

    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  backend:
    image: node:22-alpine
    container_name: sa-backend
    restart: unless-stopped

    working_dir: /app

    env_file:
      - ./backend/.env

    command: sh -c "npm install && npm start"

    volumes:
      - ./backend:/app

    ports:
      - "3006:3006"

    depends_on:
      - postgres

  frontend:
    image: node:22-alpine
    container_name: sa-frontend
    restart: unless-stopped

    working_dir: /app

    command: sh -c "npm install && npm run build && npm start"

    volumes:
      - ./frontend:/app

    ports:
      - "3005:3000"

    depends_on:
      - backend

  caddy:
    image: caddy:latest
    container_name: sa-caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
